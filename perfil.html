
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NeoCórtex - Painel do Usuário</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <header>
         <button id="botaomenu">☰ menu</button>
        <nav> 
           <div class="menu">
                <a href="index.html">home</a>
                <a href="perfil.html">perfil</a>
                <a href="teste.html">teste seu QI</a>
                
           </div> 
        </nav>
        
    </header>

    <main style="text-align: center; padding: 20px;">
        <h2>Painel do Usuário</h2>
        <br>
        
        
        <div>
            <img src="imagens/usuario-padrao.jpg" alt="Foto de Perfil" id="foto-exibida" style="width: 100px; height: 100px; border-radius: 50%;">
            <br><br>
            <label for="seletor-foto">Escolha um avatar padrão:</label><br>
            <select id="seletor-foto" onchange="mudarFoto()">
                <option value="imagens/usuario-padrao.png">Avatar Cinza Padrão</option>
                <option value="imagens/avatar-cerebro.png">Avatar Cérebro Lógico</option>
                <option value="imagens/avatar-genio.png">Avatar Gênio</option>
            </select>
        </div>

        <br><hr><br>

       
        <p><strong>Nome:</strong> <span id="perfil-nome">Carregando...</span></p>
        <p><strong>E-mail:</strong> <span id="perfil-email">Carregando...</span></p>
        
        <br>
        <h3>Seu Histórico de Avaliações</h3>
        <table border="1" style="margin: 0 auto;">
            <tr>
                <th>Último Teste Realizado</th>
                <th>Resultado Estimado</th>
            </tr>
            <tr>
                <td>Exame Psicométrico NeoCórtex</td>
                <td>Conclua a avaliação para registrar seu QI</td>
            </tr>
        </table>
    </main>
<script> 
    var questaoAtual = 1; var nomeUsuario = ""; 
    // Abrir o menu hambúrguer do cabeçalho let botaoMenu = document.querySelector("#botaomenu");
    let menuCaixa = document.querySelector(".menu"); 
    botaoMenu.addEventListener("click", function() { menuCaixa.classList.toggle("visivel"); 
    });
    // Iniciar o questionário function iniciarTeste() 
    { nomeUsuario = document.getElementById("nome").value; 
    document.getElementById("tela-inicial").style.display = "none"; 
    document.getElementById("tela-perguntas").style.display = "block";
    document.getElementById("boas-vindas-usuario").innerHTML = "Boa sorte, " + nomeUsuario + "!"; return false; 
    } 
    // Avançar perguntas function avancarQuestao() 
    { if (questaoAtual == 1) { document.getElementById("q1").style.display = "none";
    document.getElementById("q2").style.display = "block";
    questaoAtual = 2;
    } else if (questaoAtual == 2)
    { document.getElementById("q2").style.display = "none";
    document.getElementById("q3").style.display = "block";
    questaoAtual = 3; 
    } }
    // Voltar perguntas function voltarQuestao()
    { if (questaoAtual == 2) { document.getElementById("q2").style.display = "none"; 
    document.getElementById("q1").style.display = "block";
    questaoAtual = 1; 
    }else if (questaoAtual == 3) { document.getElementById("q3").style.display = "none"; 
    document.getElementById("q2").style.display = "block"; 
    questaoAtual = 2;
    } } 
    // Processar notas e mudar para a página de histórico function finalizarTeste() 
    { var acertos = 0;
    var r1 = document.querySelector('input[name="p1"]:checked');
    var r2 = document.querySelector('input[name="p2"]:checked');
    var r3 = document.querySelector('input[name="p3"]:checked'); 
    if (!r1 || !r2 || !r3) { alert("Por favor, responda todas as questões!");return; 
    } if (r1.value == "correto") { acertos++;
    } if (r2.value == "correto") { acertos++; 
    }if (r3.value == "correto") { acertos++;
    }
    var qiFinal = 70 + (acertos * 20);
    alert("Parabéns, " + nomeUsuario + "! Seu QI estimado é de: " + qiFinal); 
    window.location.href = "historico.html?nome=" + encodeURIComponent(nomeUsuario) + "&qi=" + qiFinal; } 
</script
</body>
</html>
