<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoCórtex - Histórico</title>
    <!-- Vínculo com o seu CSS externo único (Slide CSS 1, Pág. 6) -->
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <header>
       
        <button id="botaomenu">☰ menu</button>
        <nav> 
            <div class="menu">
                <a href="index.html">home</a>
                <a href="home.html">login</a>
                <a href="perfil.html">perfil</a>
                <a href="teste.html">teste seu QI</a>
                <a href="historico.html">histórico</a>
            </div> 
        </nav>
    </header>

    <main style="padding: 20px;">
        <h2>Histórico de Avaliações</h2>
        
       
        <p id="mensagem-resultado">Nenhum teste recente encontrado no histórico.</p>
        
        <br><br>
        
        <!-- Botão de compartilhamento geral (Começa invisível) -->
        <a id="botaocompartilhar" href="#" target="_blank" style="display: none; padding: 12px 20px; background-color: #25d366; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">
            🟢 Compartilhar Resultado no WhatsApp
        </a>
    </main>

    <!-- JAVASCRIPT CORRIGIDO (Sintaxe pura das aulas da Monique) -->
    <script>
        // 1. CONTROLE DO MENU HAMBÚRGUER (Protegido contra travamentos)
        var btnMenuHistorico = document.getElementById("botaomenu");
        var caixaMenuHistorico = document.querySelector(".menu");

        if (btnMenuHistorico && caixaMenuHistorico) {
            btnMenuHistorico.addEventListener("click", function() {
                caixaMenuHistorico.classList.toggle("visivel");
            });
        }

        // 2. CAPTURA DOS PARÂMETROS DA URL VINDOS DO TESTE.HTML
        var urlParams = new URLSearchParams(window.location.search);
        var qi = urlParams.get('qi');
        var nome = urlParams.get('nome');

       
        if (qi && nome) {
            var elementoTexto = document.getElementById("mensagem-resultado");
            var elementoBotao = document.getElementById("botaocompartilhar");

            if (elementoTexto) {
                elementoTexto.innerHTML = "Prezado(a) <strong>" + nome + "</strong>, o seu teste foi registrado! Seu resultado estimado é de <strong>QI " + qi + "</strong>.";
            }

            // Monta o link de compartilhamento geral sem número fixo (Requisito de envio de texto)
            var textoMensagem = "Olá! Meu resultado no Teste NeoCórtex foi QI " + qi;
            var linkWhats = "https://wa.me" + encodeURIComponent(textoMensagem);

            if (elementoBotao) {
                elementoBotao.href = linkWhats;
                elementoBotao.style.display = "inline-block"; // Faz o botão verde aparecer
            }
        }
    </script>
</body>
</html>
