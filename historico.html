<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoCórtex - Histórico</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <header style="background-color: #ffffff; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
        <!-- Botão do menu idêntico ao ID do seu script -->
        <button id="botaomenu" style="background: #333; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer;">☰ menu</button>
        <nav> 
            <div class="menu">
                <a href="index.html" style="display: block; margin: 5px 0; text-decoration: none; color: #333;">home</a>
                <a href="home.html" style="display: block; margin: 5px 0; text-decoration: none; color: #333;">login</a>
                <a href="perfil.html" style="display: block; margin: 5px 0; text-decoration: none; color: #333;">perfil</a>
                <a href="teste.html" style="display: block; margin: 5px 0; text-decoration: none; color: #333;">teste seu QI</a>
                <a href="historico.html" style="display: block; margin: 5px 0; text-decoration: none; color: #333;">histórico</a>
            </div> 
        </nav>
    </header>

    <main>
        <h2 style="margin-top: 0;">Histórico de Avaliações</h2>
        
        <!-- Mensagem de texto com o ID correto para o JavaScript preencher -->
        <p id="mensagem-resultado">Nenhum teste recente encontrado no histórico.</p>
        
        <br>
        
        <!-- 🟢 O BOTÃO DO WHATSAPP QUE ESTAVA FALTANDO NO SEU HTML! -->
        <a id="botaocompartilhar" href="#" target="_blank" style="display: none; padding: 12px 20px; background-color: #25d366; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; text-align: center;">
            Compartilhar Resultado no WhatsApp
        </a>
    </main>

    <!-- JAVASCRIPT ORGANIZADO (Sem códigos duplicados e sem chaves soltas) -->
    <script> 
        // 1. Controle do menu hambúrguer padrão (Sintaxe da Monique)
        var botao = document.querySelector("#botaomenu");
        var menuCaixa = document.querySelector(".menu");
        
        if (botao && menuCaixa) {
            botao.addEventListener("click", function() { 
                menuCaixa.classList.toggle("visivel"); 
            });
        }

        // 2. Lógica para pegar os parâmetros do teste vindo da barra de endereço
        var urlParams = new URLSearchParams(window.location.search);
        var qi = urlParams.get('qi');
        var nome = urlParams.get('nome');

        // 3. Se existir um resultado na URL, modifica a tela dinamicamente
        if (qi && nome) { 
            var campoTexto = document.getElementById("mensagem-resultado");
            var btnZap = document.getElementById("botaocompartilhar");

            if (campoTexto) {
                campoTexto.innerHTML = "<strong>" + nome + "</strong>, seu teste foi registrado com sucesso! O seu resultado estimado é de <strong>QI " + qi + "</strong>."; 
            }
            
            // Monta o texto de compartilhamento geral para o WhatsApp
            var textoMensagem = "Olá! Meu resultado no Teste NeoCórtex foi QI " + qi;
            var linkWhats = "https://wa.me/?text=" + encodeURIComponent(textoMensagem);
            
            if (btnZap) {
                btnZap.href = linkWhats; 
                btnZap.style.display = "inline-block"; // Faz o botão verde surgir magicamente na tela
            }
        } 
    </script>
</body>
</html>
