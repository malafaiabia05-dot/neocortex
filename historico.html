<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NeoCórtex - Histórico</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <header>
        <button id="botaomenu">☰ menu</button>
        <nav> 
           <div class="menu">
                <a href="index.html">home</a>
                <a href="perfil.html">perfil</a>
                <a href="teste.html">teste seu QI</a>
                <a href="historico.html">histórico</a>
           </div> 
        </nav>
    </header>

    <main>
        <script>
        <h1>Histórico dos Testes de QI</h1>
        <br>
        <p>O conceito de Quociente de Inteligência (QI) foi criado no século XX para medir a capacidade de raciocínio lógico de uma pessoa.</p>
        
        <!-- Mensagem dinâmica que mudará se a pessoa vier do teste -->
        <p id="mensagem-resultado">Abaixo estão as faixas de classificação padrão utilizadas mundialmente:</p>
        
        <ul>
            <li><strong>Gênio:</strong> Acima de 130 pontos.</li>
            <li><strong>Média Padrão:</strong> Entre 90 e 109 pontos.</li>
            <li><strong>Baixo Rendimento:</strong> Abaixo de 70 pontos.</li>
        </ul>

        <br>
        <!-- CORREÇÃO: O botão saiu de dentro do script e virou um link de compartilhamento -->
        <a id="botaocompartilhar" href="#" target="_blank" style="display: none; padding: 12px 20px; background-color: #25d366; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">
            Compartilhe já seu QI!
        </a>
    </main>
<script> 
    // 1. Controle do menu hambúrguer (Slide de JS)
    var botao = document.querySelector("#botaomenu");
    var menuCaixa = document.querySelector(".menu");
    
    if (botao && menuCaixa) {
        botao.addEventListener("click", function() { 
            menuCaixa.classList.toggle("visivel"); 
        });
    }

    // 2. Lógica simples para pegar o QI vindo da página anterior pela URL (Slide de JS)
    var urlParams = new URLSearchParams(window.location.search);
    var qi = urlParams.get('qi'); 
    var nome = urlParams.get('nome');

    // 3. Se existir um resultado, exibe o botão do WhatsApp customizado (Slide de JS, Pág. 25)
    if (qi) { 
        // Verifica se o elemento de texto existe na página antes de injetar
        if (document.getElementById("mensagem-resultado")) {
            document.getElementById("mensagem-resultado").innerHTML = "<strong>" + nome + "</strong>, seu teste foi registrado com sucesso!"; 
        }
        
        // Monta a mensagem geral para compartilhar no WhatsApp (Sem número travado)
        var textoMensagem = "Olá! Meu resultado no Teste NeoCórtex foi QI " + qi;
        var linkWhats = "https://wa.me/?text=" + encodeURIComponent(textoMensagem);
        
        // Ativa o botão verde na tela se o elemento existir
        var btnZap = document.getElementById("botaocompartilhar");
        if (btnZap) {
            btnZap.href = linkWhats; 
            btnZap.style.display = "inline-block"; 
        }
    } 
</script>
</body>
</html>
