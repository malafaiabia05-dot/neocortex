<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoCórtex - Histórico</title>
    <!-- Vínculo com o seu CSS externo único (Slide CSS 1, Pág. 6) -->
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <header>
       
        <button id="botaomenu">☰ menu</button>
        <nav> 
            <div class="menu">
                <a href="index.html">home</a>
                <a href="home.html">login</a>
                <a href="perfil.html">perfil</a>
                <a href="teste.html">teste seu QI</a>
                <a href="historico.html">histórico</a>
            </div> 
        </nav>
    </header>

    <main style="padding: 20px;">
        <h2>Histórico de Avaliações</h2>
        
       
        <p id="mensagem-resultado">Nenhum teste recente encontrado no histórico.</p>
        
        <br><br>
        
        <!-- Botão de compartilhamento geral (Começa invisível) -->
        <a id="botaocompartilhar" href="#" target="_blank" style="display: none; padding: 12px 20px; background-color: #25d366; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">
            🟢 Compartilhar Resultado no WhatsApp
        </a>
    </main>

    <script> 
        let botaoMenu = document.querySelector("#botaomenu"); 
        let menuCaixa = document.querySelector(".menu");
        botaoMenu.addEventListener("click", function() { menuCaixa.classList.toggle("visivel");
                                                       }); }); // 1. Controle do menu hambúrguer let botao = document.querySelector("#botaomenu");
        let menuCaixa = document.querySelector(".menu");
        botao.addEventListener("click", function() { menuCaixa.classList.toggle("visivel");
                                                   });
        // 2. Lógica simples para pegar o QI vindo da página anterior (URL) var urlParams = new URLSearchParams(window.location.search);
        var qi = urlParams.get('qi');
        var nome = urlParams.get('nome');
        // 3. Se existir um resultado, exibe o botão do WhatsApp customizado if (qi)
        { document.getElementById("mensagem-resultado").innerHTML = "<strong>" + nome + "</strong>, seu teste foi registrado com sucesso!";
         var textoMensagem = "Olá! Meu resultado no Teste NeoCórtex foi QI " + qi; 
         var linkWhats = "https://wa.me/?text=" + encodeURIComponent(textoMensagem);
         // Ativa o botão verde na tela 
         var btnZap = document.getElementById("botaocompartilhar");
         btnZap.href = linkWhats;
         btnZap.style.display = "inline-block"; } 
    </script>
</body>
</html>
